name: Build & Push Docker Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker 标签（如 v1.0.1、test，会自动补 latest）'
        required: true
        type: string
        default: 'latest'

env:
  REGISTRY_GHCR: ghcr.io
  REGISTRY_DOCKERHUB: docker.io

jobs:
  # ── amd64 构建（原生） ──
  build-amd64:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare image name (lowercase)
        id: prep
        run: |
          IMG=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          HUB_IMG="${{ secrets.DOCKERHUB_USERNAME }}/$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')"
          echo "ghcr=$IMG" >> $GITHUB_OUTPUT
          echo "hub=$HUB_IMG" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_DOCKERHUB }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY_GHCR }}/${{ steps.prep.outputs.ghcr }}:amd64
            ${{ env.REGISTRY_DOCKERHUB }}/${{ steps.prep.outputs.hub }}:amd64
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

  # ── arm64 构建（原生 arm64 runner） ──
  build-arm64:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare image name (lowercase)
        id: prep
        run: |
          IMG=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "ghcr=$IMG" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push (arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY_GHCR }}/${{ steps.prep.outputs.ghcr }}:arm64
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

  # ── 合并多架构 manifest ──
  merge:
    runs-on: ubuntu-latest
    needs: [build-amd64, build-arm64]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare image name (lowercase)
        id: prep
        run: |
          IMG=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          HUB_IMG="${{ secrets.DOCKERHUB_USERNAME }}/$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')"
          echo "ghcr=$IMG" >> $GITHUB_OUTPUT
          echo "hub=$HUB_IMG" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_DOCKERHUB }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install Docker CLI
        run: |
          curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-28.3.3.tgz | tar xz --strip-components=1 -C /usr/local/bin docker/docker

      - name: Create multi-arch manifest (GHCR)
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY_GHCR }}/${{ steps.prep.outputs.ghcr }}:latest \
            -t ${{ env.REGISTRY_GHCR }}/${{ steps.prep.outputs.ghcr }}:${{ github.event.inputs.tag }} \
            -t ${{ env.REGISTRY_GHCR }}/${{ steps.prep.outputs.ghcr }}:sha-${GITHUB_SHA::7} \
            ${{ env.REGISTRY_GHCR }}/${{ steps.prep.outputs.ghcr }}:amd64 \
            ${{ env.REGISTRY_GHCR }}/${{ steps.prep.outputs.ghcr }}:arm64

      - name: Create multi-arch manifest (Docker Hub)
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY_DOCKERHUB }}/${{ steps.prep.outputs.hub }}:latest \
            -t ${{ env.REGISTRY_DOCKERHUB }}/${{ steps.prep.outputs.hub }}:${{ github.event.inputs.tag }} \
            -t ${{ env.REGISTRY_DOCKERHUB }}/${{ steps.prep.outputs.hub }}:sha-${GITHUB_SHA::7} \
            ${{ env.REGISTRY_DOCKERHUB }}/${{ steps.prep.outputs.hub }}:amd64

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ steps.prep.outputs.hub }}
          readme-filepath: ./docker-deploy.md
          short-description: "基于 Codex Harness 打造的本地金融研究工作台"

      - name: Cleanup temp tags
        run: |
          docker buildx imagetools rm ${{ env.REGISTRY_GHCR }}/${{ steps.prep.outputs.ghcr }}:amd64 || true
          docker buildx imagetools rm ${{ env.REGISTRY_GHCR }}/${{ steps.prep.outputs.ghcr }}:arm64 || true
          docker buildx imagetools rm ${{ env.REGISTRY_DOCKERHUB }}/${{ steps.prep.outputs.hub }}:amd64 || true
